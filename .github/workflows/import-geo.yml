name: Bootstrap CiteScope from GEO upstream
on:
  push:
    paths:
      - .github/workflows/import-geo.yml
  workflow_dispatch:
permissions:
  contents: write

jobs:
  import:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Import upstream GEO research project' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CiteScope
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout original GEO at pinned revision
        uses: actions/checkout@v4
        with:
          repository: GEO-optim/GEO
          ref: c9e985f2bc4b539a01e8e9d226ff2a3d8d29a888
          path: _upstream_geo

      - name: Import complete upstream working tree
        run: |
          rsync -a --exclude='.git' _upstream_geo/ ./
          rm -rf _upstream_geo
          echo 'Original upstream: https://github.com/GEO-optim/GEO' > UPSTREAM_SOURCE.txt
          echo 'Revision: c9e985f2bc4b539a01e8e9d226ff2a3d8d29a888' >> UPSTREAM_SOURCE.txt
          echo 'Imported without modifying upstream source files; see original LICENSE.' >> UPSTREAM_SOURCE.txt

      - name: Commit upstream import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import upstream GEO research project"
            git push
          fi
