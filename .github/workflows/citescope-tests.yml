name: CiteScope Citation Integrity Tests
on:
  push:
    paths:
      - 'citescope/**'
      - 'tests/**'
      - 'examples/**'
      - 'CITESCOPE.md'
      - '.github/workflows/citescope-tests.yml'
  pull_request:
    paths:
      - 'citescope/**'
      - 'tests/**'
      - 'examples/**'
      - 'CITESCOPE.md'
      - '.github/workflows/citescope-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run citation tests
        run: |
          python -m compileall -q citescope
          python -m unittest discover -s tests -v
      - name: Verify reproducible example output
        run: |
          python -m citescope examples/citation-audit.json --output /tmp/citescope-report.json
          python -m json.tool /tmp/citescope-report.json > /dev/null
