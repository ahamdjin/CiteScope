name: Publish CiteScope to Hugging Face
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
    steps:
      - name: Validate credentials
        run: |
          if [ -z "$HF_TOKEN" ]; then echo '::error::Set HF_TOKEN secret first'; exit 1; fi
          if [ -z "$HF_SPACE_REPO" ]; then echo '::error::Set HF_SPACE_REPO variable (user/space)'; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uploader
        run: python -m pip install 'huggingface_hub>=0.25,<2'
      - name: Create or update Static Space
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import CommitOperationAdd, HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo_id = os.environ['HF_SPACE_REPO']
          api.create_repo(repo_id=repo_id, repo_type='space', space_sdk='static', private=False, exist_ok=True)
          ops = [CommitOperationAdd(path_in_repo=name, path_or_fileobj='web/' + name)
                 for name in ('index.html','style.css','app.mjs','audit-core.mjs')]
          ops.append(CommitOperationAdd(path_in_repo='README.md',path_or_fileobj='hf-space/README.md'))
          api.create_commit(repo_id=repo_id,repo_type='space',operations=ops,commit_message='Publish CiteScope static reviewer from GitHub')
          print('Space: https://huggingface.co/spaces/' + repo_id)
          PY
